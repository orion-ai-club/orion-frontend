name: Production Smoke

on:
  deployment_status:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.ref == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run production smoke checks
        run: node scripts/production-smoke.mjs

      - name: Resolve prior production alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Orion production smoke alert';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const issue = issues.find((item) => item.title === title && !item.pull_request);
            if (!issue) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ Production smoke recovered on ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });

      - name: Raise or update production alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Orion production smoke alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Production smoke checks failed.',
              '',
              '- Frontend availability + security headers',
              '- Cloudflare API gateway availability',
              '- Cloud Run direct-origin guard (must remain 403 with the expected denial message)',
              '- Production bundle scan for leaked `.run.app` origin URLs',
              '',
              `Commit: ${context.sha}`,
              `Run: ${runUrl}`,
              '',
              'A failing direct-origin check should be treated as a security regression, not a normal application 4xx.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((item) => item.title === title && !item.pull_request);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
