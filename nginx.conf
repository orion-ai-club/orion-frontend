server {
    listen 80;
    server_name localhost;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://apis.google.com https://www.google.com https://www.gstatic.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.samyao.me wss://api.samyao.me https://geo.datav.aliyun.com https://api.imgflip.com https://api.cloudinary.com https://*.googleapis.com https://securetoken.google.com https://*.firebaseio.com https://va.vercel-scripts.com https://*.vercel-insights.com https://www.google.com https://www.gstatic.com; frame-src https:; worker-src 'self' blob:; manifest-src 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Frame-Options "DENY" always;

    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip 压缩，网页加载更快
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # 核心逻辑：先找文件，找不到就返回 index.html
        try_files $uri $uri/ /index.html;
    }
}